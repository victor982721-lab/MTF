[project]
name = "MTF Lab Kraken public"
version = "0.1.0"
mode = "live"

[instrument]
symbol = "BTC/USD"
price_base = "trade"

[timeframes]
base = "1m"
values = ["1m", "5m", "15m"]
closed_only = true

[provider]
name = "kraken_public"
rest_url = "https://api.kraken.com/0/public/OHLC"
websocket_url = "wss://ws.kraken.com/v2"
rest_max_records = 720
exclude_last_uncommitted = true
trade_channel = true
ohlc_channel = true

[indicators]
ema_fast = 20
ema_slow = 50
rsi_period = 14
atr_period = 14
wilder = true

[strategy]
name = "trend_pullback_v1"
context_timeframe = "15m"
setup_timeframe = "5m"
trigger_timeframe = "1m"
lookback = 3
setup_max_atr = 0.5
rsi_threshold = 50.0
preparation_ttl_minutes = 15
one_signal_per_episode = true

[quality]
max_feed_age_seconds = 90
max_closed_candle_age_seconds = 900
max_gap_minutes = 3
require_warmup = true
