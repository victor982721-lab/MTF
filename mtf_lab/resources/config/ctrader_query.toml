[project]
name = "MTF Lab cTrader consulta"
version = "0.2.0"
mode = "live"

[instrument]
symbol = "EUR/USD"
price_base = "mid"

[timeframes]
base = "1m"
values = ["1m", "5m", "15m"]
closed_only = true

[provider]
name = "ctrader_query"

[indicators]
ema_fast = 20
ema_slow = 50
rsi_period = 14
atr_period = 14
wilder = true

[strategy]
name = "trend_pullback_v1"
context_timeframe = "15m"
setup_timeframe = "5m"
trigger_timeframe = "1m"
lookback = 3
setup_max_atr = 0.5
rsi_threshold = 50.0
preparation_ttl_minutes = 15
one_signal_per_episode = true

[quality]
max_feed_age_seconds = 90
max_closed_candle_age_seconds = 900
max_gap_minutes = 3
require_warmup = true

[ctrader]
enabled = true
operation_mode = "query"
environment = "DEMO"
required_scopes = ["accounts"]
account_id = ""
account_selected = false
token_ref = "ctrader-query-demo"
token_store_dir = "~/.local/state/mtf-lab/ctrader-tokens"

[ctrader_oauth]
client_id_env = "CTRADER_CLIENT_ID"
client_secret_env = "CTRADER_CLIENT_SECRET"
redirect_uri = "http://127.0.0.1:8767/oauth/callback"
authorization_url = "https://id.ctrader.com/my/settings/openapi/grantingaccess/"
token_url = "https://openapi.ctrader.com/apps/token"
