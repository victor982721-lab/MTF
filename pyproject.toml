[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mtf-lab"
version = "0.1.0"
description = "Plataforma local determinista de investigación cuantitativa y simulación multitemporal"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Optional Protobuf runtime for the bundled Spotware-generated cTrader codec;
# normal MTF Lab operation remains stdlib/offline.
ctrader = ["protobuf==7.36.1"]
# Development-only checks; never part of the offline/runtime dependency set.
dev = [
    "build==1.6.1",
    "coverage==7.16.0",
    "mypy==2.3.1",
    "pyright==1.1.414",
    "ruff==0.16.7",
]

[project.scripts]
mtf-lab = "mtf_lab.ops.cli:main"

[tool.setuptools.packages.find]
include = ["mtf_lab*"]

[tool.setuptools.package-data]
mtf_lab = ["resources/config/*.toml", "data/protobuf_generated/*.pyi"]
"mtf_lab.resources" = ["licenses/*.txt", "provenance/*.json"]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["mtf_lab/data/protobuf_generated"]

[tool.ruff.lint]
# Keep one explicit, reproducible lint contract instead of inheriting an
# ambient/global rule set. C901 is measured here; the architecture report
# remains the source of the complete before/after inventory.
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "C901"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
strict = true
explicit_package_bases = true
files = ["mtf_lab", "tools"]
