[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mtf-lab"
version = "0.1.0"
description = "Plataforma local determinista de investigación cuantitativa y simulación multitemporal"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Optional official Spotware SDK; normal MTF Lab operation remains stdlib/offline.
# Direct pins match requirements-ctrader.lock; install the lock for all
# transitive pins used by the validated SDK environment.
ctrader = ["ctrader-open-api==0.9.2", "service-identity==24.2.0"]
# Development-only checks; never part of the offline/runtime dependency set.
dev = [
    "build==1.6.1",
    "coverage==7.16.0",
    "mypy==2.3.1",
    "pyright==1.1.414",
    "ruff==0.16.7",
]

[project.scripts]
mtf-lab = "mtf_lab.ops.cli:main"

[tool.setuptools.packages.find]
include = ["mtf_lab*"]

[tool.setuptools.package-data]
mtf_lab = ["resources/config/*.toml"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
# Keep one explicit, reproducible lint contract instead of inheriting an
# ambient/global rule set. C901 is measured here; the architecture report
# remains the source of the complete before/after inventory.
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "C901"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
