[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mtf-lab"
version = "0.1.0"
description = "Plataforma local determinista de investigación cuantitativa y simulación multitemporal"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
mtf-lab = "mtf_lab.ops.cli:main"

[tool.setuptools.packages.find]
include = ["mtf_lab*"]
