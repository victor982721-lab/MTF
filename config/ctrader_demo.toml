[project]
name = "MTF Lab cTrader DEMO"
version = "0.2.0"
mode = "live"

[instrument]
symbol = "EUR/USD"
price_base = "mid"

[timeframes]
base = "1m"
values = ["1m", "5m", "15m"]
closed_only = true

[provider]
name = "ctrader_demo"

[indicators]
ema_fast = 20
ema_slow = 50
rsi_period = 14
atr_period = 14
wilder = true

[strategy]
name = "trend_pullback_v1"
context_timeframe = "15m"
setup_timeframe = "5m"
trigger_timeframe = "1m"
lookback = 3
setup_max_atr = 0.5
rsi_threshold = 50.0
preparation_ttl_minutes = 15
one_signal_per_episode = true

[quality]
max_feed_age_seconds = 90
max_closed_candle_age_seconds = 900
max_gap_minutes = 3
require_warmup = true

[ctrader]
enabled = false
operation_mode = "demo"
environment = "DEMO"
required_scopes = ["accounts", "trading"]
account_id = ""
account_selected = false
token_ref = "ctrader-execution-demo"
token_store_dir = "~/.local/state/mtf-lab/ctrader-tokens"

[ctrader_oauth]
client_id_env = "CTRADER_CLIENT_ID"
client_secret_env = "CTRADER_CLIENT_SECRET"
redirect_uri = "http://127.0.0.1:8767/oauth/callback"
authorization_url = "https://id.ctrader.com/my/settings/openapi/grantingaccess/"
token_url = "https://openapi.ctrader.com/apps/token"


[execution]
enabled = false
environment = "DEMO"
endpoint = "demo.ctraderapi.com:5035"
activation_required = true
scope = "trading"
max_quantity = 1.0
fixed_quantity = 1.0
max_exposure = 1000.0
max_positions = 1
max_spread = 0.0005
max_price_age_seconds = 30.0
no_martingale = true
close_only_own_positions = true
transport = "disabled_until_explicit_activation"
